[package]
name = "proto-resp"
version = "0.0.0"
edition = "2024"
publish = false
description = "Experimental protobuf-encoded RESP protocol"

[dependencies]
bytes = "1"
prost = "0.13"
resp-rs = { path = "../.." }

[build-dependencies]
prost-build = "0.13"
# Ships a protoc binary so the workspace builds without a system
# protobuf-compiler, which CI runners do not have.
protoc-bin-vendored = "3"
