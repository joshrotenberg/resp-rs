# cargo-fuzz builds this as its own workspace, separate from the root one.
[workspace]

[package]
name = "resp-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
# An oracle the crate cannot agree with by being consistently wrong.
redis-protocol = { version = "6", features = ["resp2", "resp3", "bytes"] }

[dependencies.resp-rs]
path = ".."
# Without this, parse_frame_unchecked is not compiled into any fuzz binary, so
# the safe-versus-unchecked axis was unreachable from fuzzing.
features = ["unsafe-internals"]

[[bin]]
name = "fuzz_resp2_parse"
path = "fuzz_targets/fuzz_resp2_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_resp3_parse"
path = "fuzz_targets/fuzz_resp3_parse.rs"
test = false
doc = false
bench = false

